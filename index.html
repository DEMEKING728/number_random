<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数字配置ツール（7行×6列）</title>
<style>
  body { font-family: sans-serif; padding: 10px; max-width: 600px; margin: 0 auto; }
  #result { overflow-x: auto; margin-top: 15px; }
  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  td {
    border: 1px solid #ccc;
    padding: 8px 0;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
  }
  input, button {
    font-size: 1rem;
    padding: 0.6em;
    margin-top: 0.5em;
    width: 100%;
    box-sizing: border-box;
  }
  .help-text {
    font-size: 0.85rem;
    color: #555;
    margin-top: 0.5em;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <h2>入力数字をランダム配置</h2>
  <label for="inputCommands">コマンドを入力</label><br />
  <input type="text" id="inputCommands" placeholder="f:5, s:a1;12,f:33" />
  <div class="help-text">
    ・<code>f:番号</code> → 前10マスのどこかに配置<br>
    ・<code>s:位置;番号</code> → 指定位置に固定（例: A1=最上行左端, G6=最下行右端）
  </div>
  <button onclick="generateTable()">表示</button>
  <div id="result"></div>

<script>
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 座標（例: "1a"）をインデックス（0〜41）に変換する関数
  function parsePosition(posStr) {
    const str = posStr.trim().toLowerCase();
  
    let row;
    let col;
  
    // A1形式
    let match = str.match(/^([a-g])([1-6])$/);
  
    if (match) {
      row = match[1].charCodeAt(0) - 'a'.charCodeAt(0);
      col = parseInt(match[2], 10) - 1;
    } else {
      // 1A形式
      match = str.match(/^([1-6])([a-g])$/);
  
      if (!match) {
        return null;
      }
  
      col = parseInt(match[1], 10) - 1;
      row = match[2].charCodeAt(0) - 'a'.charCodeAt(0);
    }
  
    // 7行 × 6列
    return row * 6 + col;
  }

  function generateTable() {
    const rawInput = document.getElementById('inputCommands').value;
    const commands = rawInput.split(',').map(s => s.trim()).filter(s => s.length > 0);

    const numRows = 7;
    const numCols = 6;
    const totalCells = numRows * numCols;

    // 前10マスの定義 (0行目の全6マス + 1行目の1~4列目)
    const frontPositions = [0, 1, 2, 3, 4, 5, 7, 8, 9, 10];

    const positionMap = {}; // index -> number
    const usedNumbers = new Set();
    const frontNumbers = [];

    // --- コマンド解析 ---
    for (const cmd of commands) {
      if (cmd.startsWith('s:')) {
        // s:(位置);(番号) モード
        const content = cmd.substring(2);
        const parts = content.split(';');
        if (parts.length === 2) {
          const idx = parsePosition(parts[0]);
          const num = parseInt(parts[1].trim(), 10);

          if (idx !== null && !isNaN(num) && num >= 1 && num <= 42) {
            if (!positionMap.hasOwnProperty(idx) && !usedNumbers.has(num)) {
              positionMap[idx] = num;
              usedNumbers.add(num);
            }
          }
        }
      } else if (cmd.startsWith('f:')) {
        // f:(番号) モード
        const numStr = cmd.substring(2).trim();
        const num = parseInt(numStr, 10);

        if (!isNaN(num) && num >= 1 && num <= 42) {
          if (!usedNumbers.has(num)) {
            frontNumbers.push(num);
            usedNumbers.add(num);
          }
        }
      }
    }

    // --- f: モードの配置処理 ---
    // 前10マスのうち、s: モードで埋まっていないマスを抽出
    const availableFrontPositions = frontPositions.filter(pos => !positionMap.hasOwnProperty(pos));
    const shuffledFrontPositions = shuffle(availableFrontPositions);

    const fPlaceCount = Math.min(frontNumbers.length, shuffledFrontPositions.length);
    for (let i = 0; i < fPlaceCount; i++) {
      positionMap[shuffledFrontPositions[i]] = frontNumbers[i];
    }

    // --- 残りマスのランダム埋め処理 ---
    const unusedNumbers = [];
    for (let i = 1; i <= 42; i++) {
      if (!usedNumbers.has(i)) {
        unusedNumbers.push(i);
      }
    }
    const shuffledUnused = shuffle(unusedNumbers);

    const finalList = new Array(totalCells);
    let unusedIndex = 0;

    for (let i = 0; i < totalCells; i++) {
      if (positionMap.hasOwnProperty(i)) {
        finalList[i] = positionMap[i];
      } else {
        finalList[i] = shuffledUnused[unusedIndex++];
      }
    }

    // --- テーブル描画 ---
    let html = "<table>";
    for (let row = 0; row < numRows; row++) {
      html += "<tr>";
      for (let col = 0; col < numCols; col++) {
        const index = row * numCols + col;
        html += `<td>${finalList[index]}</td>`;
      }
      html += "</tr>";
    }
    html += "</table>";

    document.getElementById('result').innerHTML = html;
  }
</script>
</body>
</html>
